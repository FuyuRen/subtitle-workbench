name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-test-package:
    name: Build, test and publish
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure debug
        run: cmake --preset msvc-debug

      - name: Build debug
        run: cmake --build --preset debug

      - name: Test debug
        run: ctest --preset debug --output-on-failure

      - name: Install Vulkan SDK
        env:
          VULKAN_SDK_VERSION: 1.4.350.0
          VULKAN_SDK_SHA256: 855b27ba05d2d8119c5114c5d4ff870ca38f2c632b11e1bb9923b9b7e6ecfe7b
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK\$env:VULKAN_SDK_VERSION"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe" -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:VULKAN_SDK_SHA256) {
              throw "Vulkan SDK checksum mismatch."
          }
          $process = Start-Process -FilePath $installer -ArgumentList @(
              "--root", $sdkRoot,
              "--accept-licenses",
              "--default-answer",
              "--confirm-command",
              "install",
              "copy_only=1"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Vulkan SDK installation failed with exit code $($process.ExitCode)."
          }
          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "$sdkRoot\Bin" >> $env:GITHUB_PATH

      - name: Configure release
        run: cmake --preset msvc-release -DSWB_BUILD_TESTS=OFF -DSWB_BUNDLE_EXTERNAL_TOOLS=OFF

      - name: Build release
        run: cmake --build --preset release

      - name: Package release
        run: |
          cpack --config build/release/CPackConfig.cmake -G ZIP -B build/release/dist
          if (-not (Test-Path "build/release/dist/subtitle-workbench-release-windows-x64.zip")) {
              throw "Package was not generated."
          }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = $env:GITHUB_REF_NAME
          $packagePath = Resolve-Path "build/release/dist/subtitle-workbench-release-windows-x64.zip"
          gh release view $tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName $packagePath --clobber
          } else {
            gh release create $tagName $packagePath --title $tagName --generate-notes
          }
